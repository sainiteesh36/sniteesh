<!doctype html>
<html lang="en">
  <head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <script>
      (function () {
        const l = window.location;
        const appBase = "/diet-tracker";

        
        
        if (l.pathname === appBase || l.pathname.startsWith(appBase + "/")) {
          const appRelativePath = l.pathname.slice(appBase.length).replace(/^\/+/, "");
          const encodedPath = appRelativePath.replace(/&/g, "~and~");
          const encodedSearch = l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "";
          l.replace(
            l.protocol +
              "//" +
              l.host +
              appBase +
              "/?/" +
              encodedPath +
              encodedSearch +
              l.hash,
          );
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        text-align: center;
        max-width: 560px;
      }
      h1 {
        margin-bottom: 8px;
      }
      p {
        margin: 0 0 12px 0;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Page not found.</p>
      <p><a href="/">Go back home</a></p>
    </main>
  </body>
</html>
